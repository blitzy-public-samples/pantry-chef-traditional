version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: unless-stopped
    environment:
      # Security: source DB root credentials from the operator-provided .env
      # (eliminates hardcoded guessable admin/123456 defaults).
      MONGO_INITDB_ROOT_USERNAME: ${DATABASE_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - '27017:27017'
    volumes:
      - ./data/db:/data/db
      - ./data/configdb:/data/configdb

  nestjs:
    build: .
    container_name: nestjs_app
    restart: unless-stopped
    depends_on:
      - mongodb
    env_file: "./.env"
    ports:
      - '3000:3000'
    volumes:
      - ./:/home/node/app
    environment:
      DATABASE_URL: mongodb://mongodb:27017

